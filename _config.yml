# Setup
title: Wenyue Zhou
description: >
  PostDoc in Purple Mountain Laboratory, Nanjing, China.<br>
  Southeast University.<br>
  <em><strong>I am rooted, but I flow.</strong></em>
url: https://zzzwypin.github.io
avatar: /Googlescholar.jpg
paginate: 5
permalink: pretty
cover_image: /bg.jpeg

# Gems
plugins:
  - jekyll-gist
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

# Optimize Jekyll
exclude:
  - .editorconfig
  - .git
  - .jekyll-cache
  - Gemfile
  - Gemfile.lock
  - LICENSE.md
  - README.md
  - scripts/
  - not-pure-poole.gemspec

# Optimize Jekyl SEO Tag
# twitter:
#   username: zqtan
#   card: summary
logo: logo.png
social:
  name: Wenyue Zhou
  links:
    # - https://twitter.com/vszhub
    - https://scholar.google.com/citations?user=0SxaVzkAAAAJ&hl=zh-CN
    - https://github.com/ZzzwyPIN/
google_site_verification: xxxxx
lang: en

sass:
  sass_dir: _sass
  style: :compressed

# Options

# Replace this value and uncomment to enable Google Analytics tracking
# google_analytics: UA-000000-0

# Replace this value and uncomment to enable Disqus
# disqus: xxxxxx

# Specify the author for blog posts
author:
  name: Wenyue Zhou
  url: https://github.com/ZzzwyPIN/
  email: zzzwypin@foxmail.com
